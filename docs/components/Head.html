<meta name="author" content="James Cole">
<!-- Matomo -->
<script>
    var _paq = window._paq = window._paq || [];
    /* tracker methods like "setCustomDimension" should be called before "trackPageView" */
    _paq.push(['trackPageView']);
    _paq.push(['enableLinkTracking']);
    (function () {
        var u = "https://analytics.firefly-iii.org/";
        _paq.push(['setTrackerUrl', u + 'matomo.php']);
        _paq.push(['setSiteId', '8']);
        // Sourcey marks a missing page on <html>.
        if (document.documentElement.dataset.sourceyPage === 'not-found') {
            _paq.push(['trackEvent', 'PageEvents', 'View404Page', 'View404Page', window.location.pathname]);
        }
        var d = document, g = d.createElement('script'), s = d.getElementsByTagName('script')[0];
        g.async = true;
        g.src = u + 'matomo.js';
        s.parentNode.insertBefore(g, s);

        // "Was this page helpful?": Sourcey sends each rating as a sourcey:feedback event.
        document.addEventListener('sourcey:feedback', function (event) {
            var page = event.detail.page;
            var data = String(event.detail.value);

            // post to custom script.
            fetch("https://support.firefly-iii.org/submit_feedback.php", {
                method: "POST",
                body: JSON.stringify({
                    feedback: data,
                    page: page,
                }),
                headers: {
                    "Content-type": "application/json; charset=UTF-8"
                }
            });

            // post to Matomo.
            _paq.push(['trackEvent', 'PageEvents', 'SendFeedback', page, data]);

            if ('0' === data) {
                var element = document.getElementById('empty-feedback-form');
                element.setAttribute('data-tf-live', '01HHJ4Q8SVJGPQHPDE3V14DHSB');
                var t = document.createElement('script');
                t.src = '//embed.typeform.com/next/embed.js?utm_source=' + window.location.href;
                document.body.appendChild(t);
            }
        });
    })();
</script>
<!-- End Matomo Code -->
