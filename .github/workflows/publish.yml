name: Publish documentation
on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "12 9 * * *"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so each page is dated by its file's last commit.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - id: ff3version
        uses: pozetroninc/github-action-get-latest-release@master
        with:
          owner: firefly-iii
          repo: firefly-iii
          excludes: prerelease, draft
          token: ${{ secrets.GITHUB_TOKEN }}
      - id: importerversion
        uses: pozetroninc/github-action-get-latest-release@master
        with:
          owner: firefly-iii
          repo: data-importer
          excludes: prerelease, draft
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build documentation
        env:
          # The header's GitHub button reads the latest release, stars and forks with the workflow's token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd $GITHUB_WORKSPACE/docs
          echo "Latest Firefly III release is ${{ steps.ff3version.outputs.release }}"
          echo "Latest Data Importer release is ${{ steps.importerversion.outputs.release }}"
          grep -rl '%PHPVERSION' ./docs | xargs sed -i 's/%PHPVERSION/8\.5/g'
          grep -rl '%IMPORTERVERSION' ./docs | xargs sed -i 's/%IMPORTERVERSION/${{ steps.importerversion.outputs.release }}/g'
          grep -rl '%FFVERSION' ./docs | xargs sed -i 's/%FFVERSION/${{ steps.ff3version.outputs.release }}/g'
          npm ci
          npm run build

          # also copy security.txt, beside the discovery files the build writes there
          mkdir -p site/.well-known
          cp -r docs/.well-known/. site/.well-known/
      - uses: cloudflare/wrangler-action@v4
        name: Publish to Cloudflare
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: aaf8eef9dd565a13de210d18c7462092
          command: |
            pages deploy docs/site --project-name=docs --commit-dirty=true
